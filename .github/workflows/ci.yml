name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: History hygiene and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Repeats the local hooks, so a commit made with --no-verify is still caught.
      - name: No AI attribution in authors or messages
        run: |
          if git log --format='%an %ae %cn %ce%n%B' | grep -Eiq 'co-authored-by|generated with|anthropic|claude'; then
            echo "::error::history contains AI attribution"
            exit 1
          fi
      - name: Scan full history for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner .

  backend:
    name: Backend (ruff, pytest)
    runs-on: ubuntu-latest
    env:
      MOCK_LLM: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -r requirements-dev.lock
      - name: Ruff
        run: |
          .venv/bin/ruff format --check .
          .venv/bin/ruff check .
      - name: Tests
        run: .venv/bin/python -m pytest -q
