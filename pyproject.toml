# Tool configuration only. Dependencies live in requirements*.txt and their locks.

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# E501: line length is the formatter's job. B008: FastAPI's Depends() in defaults is idiomatic.
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# No network in tests: the suite must pass offline (acceptance check 12).
addopts = "-ra --disable-socket --allow-unix-socket"
markers = [
  "slow: long-running solver or end-to-end checks; skipped by the pre-commit hook",
]
