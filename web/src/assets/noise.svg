<!-- Grain texture. Overlay at opacity .5 with mix-blend-mode: soft-light on dark gradient surfaces (CTA band). Tile at 512px. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  <rect width="100%" height="100%" filter="url(#n)" opacity=".9"/>
</svg>
